[project]
name = "neurocli"
version = "0.1.0"
description = "An agentic, terminal-based AI assistant for developers."
dependencies = [
    "textual",
    "python-dotenv",
    "openai",
    "textual-fspicker",
    "ruff",
    "fastapi",
    "uvicorn",
    "pydantic",
    "sse-starlette",
]

[project.scripts]
neurocli = "neurocli_app.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
# These files are intentionally malformed inputs for formatter demonstrations.
exclude = ["tests/messy tests"]
target-version = "py310"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
